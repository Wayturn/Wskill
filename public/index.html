<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wskill</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f2;color:#202925;font:17px/1.7 system-ui,sans-serif}main{max-width:780px;margin:0 auto;padding:7vh 20px}header{border-bottom:1px solid #b7c0b8;margin-bottom:1.6rem}h1{font-size:clamp(2rem,7vw,3.7rem);letter-spacing:-.06em;margin:0}p{margin:.6rem 0 1rem}textarea{width:100%;min-height:100px;border:1px solid #828f85;border-radius:12px;background:#fff;color:inherit;resize:vertical;font:inherit;padding:14px}button{background:#fff;border:1px solid #748278;border-radius:20px;color:inherit;font:inherit;padding:4px 18px;cursor:pointer;margin:.25rem}button[type=submit]{background:#184d3b;color:white}button:disabled{opacity:.5}.turn{white-space:pre-wrap;overflow-wrap:anywhere;margin:1rem 0;padding:1rem;border-radius:12px;background:white}.user{background:#e5ede5;margin-left:10%}label{display:block;margin-top:1rem}#status{min-height:1.7em}</style></head>
<body><main><header><h1 id="title">Wskill</h1><p id="desc"></p></header><section id="chat" aria-label="對話"></section><form><label for="input">你的訊息</label><textarea id="input" required maxlength="4000"></textarea><button type="submit" id="send" disabled>送出</button><button type="button" id="sample" disabled>試用範例</button></form><p id="status" role="status"></p></main><script type="module" src="/app.js"></script></body></html>
